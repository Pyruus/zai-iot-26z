name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test backend --configuration Release

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng test --watch=false
      - run: npx ng build

  contract:
    name: Contract tests (zai-tests.mjs)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start application
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do curl -sf http://localhost:8080/api/health && break; sleep 2; done
      - name: Create admin and seed demo data
        run: |
          echo "ADMIN_PASS=ci-$(openssl rand -hex 12)" >> "$GITHUB_ENV"
          source "$GITHUB_ENV"
          docker compose exec -T -e ZAI_ADMIN_PASSWORD="$ADMIN_PASS" api dotnet Zai.Api.dll create-admin --username admin
          ZAI_ADMIN_PASS="$ADMIN_PASS" python3 generator/seed_demo.py --pattern sine --days 1
      - name: Run official test script
        run: |
          node tests/zai-tests.mjs --app http://localhost:8080 --user admin --pass "$ADMIN_PASS" --stage E2 | tee result.txt
          grep -q "A1/A2 kontrakt: 6$" result.txt
          grep -q "A3 walidacja: 4$" result.txt
      - name: Application logs
        if: failure()
        run: docker compose logs api

  publish:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: [contract]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/pyruus/zai-iot-26z:latest
            ghcr.io/pyruus/zai-iot-26z:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
